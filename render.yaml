services:
  - type: web
    name: decisionai-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: decisionai-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/decisionai.db
      - key: AUDIO_STORAGE_DIR
        value: /var/data/audio_storage
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma_data
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.5-flash-lite
      - key: TRANSCRIPTION_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        value: https://decisionai-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://decisionai-backend.onrender.com/auth/google/callback
